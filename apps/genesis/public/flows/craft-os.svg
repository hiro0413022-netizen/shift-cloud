<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 760" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Craft OS フロー</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7f99"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3ECBEC"/></marker></defs><rect x="0" y="0" width="900" height="760" rx="12" fill="#05070d"/><rect x="40" y="16" width="330" height="30" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="205" y="36.5" text-anchor="middle" font-size="13.5" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">Craft OS（フィッティング・見積・工房）</text><rect x="40" y="64" width="380" height="60" rx="7" fill="#0B2E55" stroke="#5EA1E6" stroke-width="1.3"/><text x="230.0" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#D6E8FB" font-family="ui-sans-serif, system-ui, sans-serif">表紙をつくる（/f）</text><text x="230.0" y="108" text-anchor="middle" font-size="13" fill="#8FBFF0" font-family="ui-sans-serif, system-ui, sans-serif">お客様は受付台帳から選ぶ。試打NOを入れるだけ</text><line x1="230" y1="124" x2="230" y2="150" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="154" width="380" height="60" rx="7" fill="#0B2E55" stroke="#5EA1E6" stroke-width="1.3"/><text x="230.0" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#D6E8FB" font-family="ui-sans-serif, system-ui, sans-serif">お渡しする紙を印刷（A4横）</text><text x="230.0" y="198" text-anchor="middle" font-size="13" fill="#8FBFF0" font-family="ui-sans-serif, system-ui, sans-serif">試打11行・定価は商品マスタから自動</text><line x1="230" y1="214" x2="230" y2="240" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="244" width="380" height="60" rx="7" fill="#0B2E55" stroke="#5EA1E6" stroke-width="1.3"/><text x="230.0" y="266" text-anchor="middle" font-size="16" font-weight="600" fill="#D6E8FB" font-family="ui-sans-serif, system-ui, sans-serif">採用した本数ぶん 伝票をつくる</text><text x="230.0" y="288" text-anchor="middle" font-size="13" fill="#8FBFF0" font-family="ui-sans-serif, system-ui, sans-serif">1つの表紙から何件でも。返金枠は表紙で共有</text><line x1="230" y1="304" x2="230" y2="330" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="334" width="380" height="68" rx="7" fill="#0B2E55" stroke="#5EA1E6" stroke-width="1.3"/><text x="230.0" y="356" text-anchor="middle" font-size="16" font-weight="600" fill="#D6E8FB" font-family="ui-sans-serif, system-ui, sans-serif">明細（/q/…/quote）</text><text x="230.0" y="378" text-anchor="middle" font-size="13" fill="#8FBFF0" font-family="ui-sans-serif, system-ui, sans-serif">掛け率は割引率表から自動・明細ごとに打ち替え可</text><line x1="230" y1="402" x2="230" y2="428" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="432" width="380" height="60" rx="7" fill="#0B2E55" stroke="#5EA1E6" stroke-width="1.3"/><text x="230.0" y="454" text-anchor="middle" font-size="16" font-weight="600" fill="#D6E8FB" font-family="ui-sans-serif, system-ui, sans-serif">ご注文書を印刷</text><text x="230.0" y="476" text-anchor="middle" font-size="13" fill="#8FBFF0" font-family="ui-sans-serif, system-ui, sans-serif">見積書は必要なときだけ。注文書だけで完結できる</text><line x1="230" y1="492" x2="230" y2="518" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="522" width="380" height="68" rx="7" fill="#0B2E55" stroke="#5EA1E6" stroke-width="1.3"/><text x="230.0" y="544" text-anchor="middle" font-size="16" font-weight="600" fill="#D6E8FB" font-family="ui-sans-serif, system-ui, sans-serif">工房（/q/…/work）</text><text x="230.0" y="566" text-anchor="middle" font-size="13" fill="#8FBFF0" font-family="ui-sans-serif, system-ui, sans-serif">目標値＋組み上がりの実測。組立指示書はA4横</text><line x1="230" y1="590" x2="230" y2="616" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="620" width="380" height="60" rx="7" fill="#07364A" stroke="#3ECBEC" stroke-width="1.3"/><text x="230.0" y="642" text-anchor="middle" font-size="16" font-weight="600" fill="#CDF3FC" font-family="ui-sans-serif, system-ui, sans-serif">お渡し・お支払い</text><text x="230.0" y="664" text-anchor="middle" font-size="13" fill="#7FD9EF" font-family="ui-sans-serif, system-ui, sans-serif">お渡し日を入れた時点で売上が立つ</text><rect x="520" y="154" width="330" height="60" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="685.0" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">発注管理（GolfOrder）</text><text x="685.0" y="198" text-anchor="middle" font-size="13" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">商品マスタ＝定価の正典。craft-osは持たない</text><rect x="520" y="432" width="330" height="60" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="685.0" y="454" text-anchor="middle" font-size="16" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">発注プール</text><text x="685.0" y="476" text-anchor="middle" font-size="13" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">仕入先ごとに下書き。送るのは発注管理から</text><rect x="520" y="522" width="330" height="60" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="685.0" y="544" text-anchor="middle" font-size="16" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">入荷を登録</text><text x="685.0" y="566" text-anchor="middle" font-size="13" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">craft-os の「到着」日が自動で入る</text><rect x="520" y="620" width="330" height="60" rx="7" fill="#07364A" stroke="#3ECBEC" stroke-width="1.3"/><text x="685.0" y="642" text-anchor="middle" font-size="16" font-weight="600" fill="#CDF3FC" font-family="ui-sans-serif, system-ui, sans-serif">Money OS（mon_sales_lines）</text><text x="685.0" y="664" text-anchor="middle" font-size="13" fill="#7FD9EF" font-family="ui-sans-serif, system-ui, sans-serif">事業別PLへ。返金はマイナス行で落とす</text><rect x="520" y="64" width="330" height="60" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="685.0" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">受付台帳（Member OS）</text><text x="685.0" y="108" text-anchor="middle" font-size="13" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">mbr_guests。毎回お名前と電話を書かない</text><line x1="520" y1="94" x2="424" y2="94" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><line x1="520" y1="184" x2="424" y2="364" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><line x1="424" y1="462" x2="516" y2="462" stroke="#3ECBEC" stroke-width="1.6" marker-end="url(#arg)"/><line x1="516" y1="552" x2="424" y2="552" stroke="#3ECBEC" stroke-width="1.6" marker-end="url(#arg)"/><line x1="424" y1="650" x2="516" y2="650" stroke="#3ECBEC" stroke-width="1.6" marker-end="url(#arg)"/><line x1="685" y1="214" x2="685" y2="428" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><line x1="685" y1="492" x2="685" y2="518" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><text x="472" y="88" text-anchor="middle" font-size="11" fill="#7C8DA6" font-family="ui-sans-serif, system-ui, sans-serif">自動</text><text x="470" y="456" text-anchor="middle" font-size="11" fill="#3ECBEC" font-family="ui-sans-serif, system-ui, sans-serif">自動</text><text x="470" y="546" text-anchor="middle" font-size="11" fill="#3ECBEC" font-family="ui-sans-serif, system-ui, sans-serif">自動</text><text x="470" y="644" text-anchor="middle" font-size="11" fill="#3ECBEC" font-family="ui-sans-serif, system-ui, sans-serif">自動</text><text x="40" y="712" text-anchor="start" font-size="12" fill="#7C8DA6" font-family="ui-sans-serif, system-ui, sans-serif">定価は持たない（正典は発注管理の商品マスタ）／割引・返金の計算は @yozan/core/fitting-quote 1か所</text><text x="40" y="734" text-anchor="start" font-size="12" fill="#7C8DA6" font-family="ui-sans-serif, system-ui, sans-serif">表紙と伝票は別物。グリップ交換だけのご注文は表紙なしで伝票だけ作れる</text></svg>