<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 486" role="img"><title>議事録 フロー</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7f99"/></marker></defs><rect x="0" y="0" width="680" height="486" rx="12" fill="#05070d"/><rect x="40" y="16" width="300" height="30" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="190.0" y="36.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">議事録（録音・文字起こし・要約）</text><rect x="40" y="64" width="340" height="56" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="210.0" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">会議を作る</text><text x="210.0" y="107" text-anchor="middle" font-size="12.5" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">機密レベル（変更不可）・要約の種類・参加者の了承</text><line x1="210" y1="120" x2="210" y2="144" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="148" width="340" height="56" rx="7" fill="#07364A" stroke="#3ECBEC" stroke-width="1.3"/><text x="210.0" y="169" text-anchor="middle" font-size="15" font-weight="600" fill="#CDF3FC" font-family="ui-sans-serif, system-ui, sans-serif">取り込む</text><text x="210.0" y="191" text-anchor="middle" font-size="12.5" fill="#7ADFF5" font-family="ui-sans-serif, system-ui, sans-serif">その場で録音（10分ごと送信）／音声ファイル／貼り付け</text><line x1="210" y1="204" x2="210" y2="228" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="232" width="340" height="56" rx="7" fill="#07364A" stroke="#3ECBEC" stroke-width="1.3"/><text x="210.0" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#CDF3FC" font-family="ui-sans-serif, system-ui, sans-serif">文字起こし（区間ごと）</text><text x="210.0" y="275" text-anchor="middle" font-size="12.5" fill="#7ADFF5" font-family="ui-sans-serif, system-ui, sans-serif">終わった区間の音声はその場で削除</text><line x1="210" y1="288" x2="210" y2="312" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="316" width="340" height="56" rx="7" fill="#07364A" stroke="#3ECBEC" stroke-width="1.3"/><text x="210.0" y="337" text-anchor="middle" font-size="15" font-weight="600" fill="#CDF3FC" font-family="ui-sans-serif, system-ui, sans-serif">場面別に要約（AIの下書き）</text><text x="210.0" y="359" text-anchor="middle" font-size="12.5" fill="#7ADFF5" font-family="ui-sans-serif, system-ui, sans-serif">根拠の発言を文字起こしと照合・無ければ赤</text><line x1="210" y1="372" x2="210" y2="396" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><rect x="40" y="400" width="340" height="56" rx="7" fill="#232060" stroke="#9BA6F2" stroke-width="1.3"/><text x="210.0" y="421" text-anchor="middle" font-size="15" font-weight="600" fill="#DDE1FC" font-family="ui-sans-serif, system-ui, sans-serif">人が確認して確定</text><text x="210.0" y="443" text-anchor="middle" font-size="12.5" fill="#AEB6F5" font-family="ui-sans-serif, system-ui, sans-serif">本文とToDoだけが正式な議事録・印刷/PDF</text><rect x="400" y="64" width="260" height="30" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="539.0" y="84.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">AIの行き先（levels.ts が決める）</text><rect x="400" y="108" width="260" height="56" rx="7" fill="#07364A" stroke="#3ECBEC" stroke-width="1.3"/><text x="539.0" y="129" text-anchor="middle" font-size="15" font-weight="600" fill="#CDF3FC" font-family="ui-sans-serif, system-ui, sans-serif">L1 通常 / L2 社外秘</text><text x="539.0" y="151" text-anchor="middle" font-size="12.5" fill="#7ADFF5" font-family="ui-sans-serif, system-ui, sans-serif">Google Gemini（L2は有料枠のみ）</text><rect x="400" y="178" width="260" height="56" rx="7" fill="#3A2A07" stroke="#E0A63E" stroke-width="1.3"/><text x="539.0" y="199" text-anchor="middle" font-size="15" font-weight="600" fill="#FBE7C0" font-family="ui-sans-serif, system-ui, sans-serif">L3 秘匿</text><text x="539.0" y="221" text-anchor="middle" font-size="12.5" fill="#F2C879" font-family="ui-sans-serif, system-ui, sans-serif">YOZAN専用サーバー（フェーズ3）</text><rect x="400" y="248" width="260" height="56" rx="7" fill="#3F0F1A" stroke="#F0708A" stroke-width="1.3"/><text x="539.0" y="269" text-anchor="middle" font-size="15" font-weight="600" fill="#FDD5DE" font-family="ui-sans-serif, system-ui, sans-serif">L3を外部AIに流さない</text><text x="539.0" y="291" text-anchor="middle" font-size="12.5" fill="#F5A3B5" font-family="ui-sans-serif, system-ui, sans-serif">サーバー未設定なら処理を止める</text><rect x="400" y="332" width="260" height="56" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="539.0" y="353" text-anchor="middle" font-size="15" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">保存 mtg_*（Supabase）</text><text x="539.0" y="375" text-anchor="middle" font-size="12.5" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">L3の中身はDBに置けない（制約）</text><rect x="400" y="402" width="260" height="56" rx="7" fill="#141D2B" stroke="#7C8DA6" stroke-width="1.3"/><text x="539.0" y="423" text-anchor="middle" font-size="15" font-weight="600" fill="#D9E1EC" font-family="ui-sans-serif, system-ui, sans-serif">見られる人</text><text x="539.0" y="445" text-anchor="middle" font-size="12.5" fill="#9AABC4" font-family="ui-sans-serif, system-ui, sans-serif">L1=権限者 / L2・L3=作成者とオーナー</text><line x1="380" y1="260" x2="398" y2="136" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="260" x2="398" y2="206" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#ar)"/></svg>
