  <path class="a" d="M180,95 L220,95"/>
  <path class="a" d="M380,95 L420,95"/>
  <path class="a" d="M580,95 L620,95"/>
  <path class="a" d="M700,130 L700,190"/>
  <text class="lbl" x="708" y="165">問い合わせフォーム</text>
  <path class="a" d="M660,130 L520,190"/>
  <path class="a" d="M300,130 L300,190"/>
  <text class="lbl" x="308" y="165">全活動を集約</text>
