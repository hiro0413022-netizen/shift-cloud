  <text class="s" x="635" y="110">/lp/* ・@yozan/trackで計測</text>

  <rect class="box" x="420" y="190" width="160" height="70"/>
  <text class="t" x="435" y="220">Sales OS</text>
  <text class="s" x="435" y="240">PGA NOTE→福原氏タスク</text>

  <rect class="box" x="620" y="190" width="160" height="70"/>
  <text class="t" x="635" y="220">CEO Inbox</text>
  <text class="s" x="635" y="240">SWING CORTEX問い合わせ</text>

  <rect class="box" x="220" y="190" width="160" height="70"/>
  <text class="t" x="235" y="220">/ai-sales</text>
